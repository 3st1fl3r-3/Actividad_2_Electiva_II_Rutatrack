<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repartidores · RutaTrack</title>
  <link rel="icon" href="img/favicon.svg">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="contenido">
      <div class="encabezado">
        <div>
          <h1>Repartidores</h1>
          <p>Registro, edición y carga de trabajo</p>
        </div>
        <button class="btn" id="btn-nuevo">+ Nuevo repartidor</button>
      </div>

      <div class="detalle-grid" style="grid-template-columns:1.6fr 1fr;align-items:start">
        <div class="tabla-contenedor">
          <table class="responsive">
            <thead>
              <tr><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Vehículo</th><th>Activos / Capacidad</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tabla-repartidores"><tr><td colspan="7" class="cargando">Cargando…</td></tr></tbody>
          </table>
        </div>

        <form class="tarjeta" id="form-repartidor">
          <h2 id="titulo-form">Nuevo repartidor</h2>
          <input type="hidden" name="id">
          <div class="form-grid">
            <div class="campo completo">
              <label for="nombre">Nombre completo <span class="obligatorio">*</span></label>
              <input id="nombre" name="nombre" maxlength="100">
              <div class="error"></div>
            </div>
            <div class="campo">
              <label for="documento">Documento <span class="obligatorio">*</span></label>
              <input id="documento" name="documento" inputmode="numeric" maxlength="10">
              <div class="error"></div>
            </div>
            <div class="campo">
              <label for="telefono">Teléfono <span class="obligatorio">*</span></label>
              <input id="telefono" name="telefono" inputmode="numeric" maxlength="10">
              <div class="error"></div>
            </div>
            <div class="campo">
              <label for="vehiculo">Vehículo <span class="obligatorio">*</span></label>
              <select id="vehiculo" name="vehiculo">
                <option value="">Seleccione…</option>
                <option>Moto</option><option>Carro</option><option>Furgón</option><option>Bicicleta</option>
              </select>
              <div class="error"></div>
            </div>
            <div class="campo">
              <label for="placa">Placa</label>
              <input id="placa" name="placa" maxlength="7" placeholder="ABC-123" style="text-transform:uppercase">
              <div class="error"></div>
            </div>
            <div class="campo">
              <label for="capacidadMax">Capacidad máx. <span class="obligatorio">*</span></label>
              <input id="capacidadMax" name="capacidadMax" type="number" min="1" max="10" value="3">
              <div class="ayuda">Pedidos activos al tiempo (1–10)</div>
              <div class="error"></div>
            </div>
            <div class="campo">
              <label for="disponible">Disponibilidad</label>
              <select id="disponible" name="disponible"><option value="true">Disponible</option><option value="false">No disponible</option></select>
            </div>
            <div class="campo completo">
              <label for="email">Correo de acceso <span class="obligatorio">*</span></label>
              <input id="email" name="email" type="email">
              <div class="error"></div>
            </div>
            <div class="campo completo" id="caja-password">
              <label for="password">Contraseña inicial <span class="obligatorio">*</span></label>
              <input id="password" name="password" type="password" autocomplete="new-password">
              <div class="error"></div>
            </div>
          </div>
          <div class="form-acciones">
            <button class="btn btn-sec" type="reset">Cancelar</button>
            <button class="btn" type="submit">Guardar</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <div id="toasts"></div>
  <script type="module" src="js/pages/repartidores.js"></script>
</body>
</html>
